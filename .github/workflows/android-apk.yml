name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write # needed to publish the GitHub Release

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Same key every build, so new APKs install as updates over old ones.
      # Without these secrets the APK is signed with a throwaway debug key
      # (still installable, but each update needs an uninstall first).
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.JELLYLOC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "JELLYLOC_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using release signing key"
          else
            echo "::warning::JELLYLOC_KEYSTORE_BASE64 secret not set - signing with a debug key"
          fi

      - name: Build release APK
        env:
          JELLYLOC_KEYSTORE_PASSWORD: ${{ secrets.JELLYLOC_KEYSTORE_PASSWORD }}
          JELLYLOC_KEY_ALIAS: ${{ secrets.JELLYLOC_KEY_ALIAS }}
          JELLYLOC_KEY_PASSWORD: ${{ secrets.JELLYLOC_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/jelly-loc.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: jelly-loc-apk
          path: jelly-loc.apk

      # Asset name stays "jelly-loc.apk" so this link always gets the newest build:
      # https://github.com/<owner>/<repo>/releases/latest/download/jelly-loc.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: Jelly Loc Android v1.0.${{ github.run_number }}
          make_latest: true
          files: jelly-loc.apk
          body: |
            **Install on your phone:** download `jelly-loc.apk` below → open it → allow "Install unknown apps" for your browser if asked.

            **One-time setup:** Settings → About phone → tap *Build number* 7 times → Developer options → *Select mock location app* → **Jelly Loc**.

            Built from ${{ github.sha }}.
