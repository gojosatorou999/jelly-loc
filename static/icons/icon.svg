<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16203a"/>
      <stop offset="70%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#080c16"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="#1f2c4c" stroke-width="3"/>

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00f5d4" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00bbf9" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Map Crosshairs -->
  <line x1="256" y1="36" x2="256" y2="76" stroke="#00f5d4" stroke-width="3" stroke-opacity="0.5"/>
  <line x1="256" y1="436" x2="256" y2="476" stroke="#00f5d4" stroke-width="3" stroke-opacity="0.5"/>
  <line x1="36" y1="256" x2="76" y2="256" stroke="#00f5d4" stroke-width="3" stroke-opacity="0.5"/>
  <line x1="436" y1="256" x2="476" y2="256" stroke="#00f5d4" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Jellyfish Bell / GPS Pin Head -->
  <path d="M 166 210 C 166 140, 346 140, 346 210 C 346 230, 326 235, 310 225 C 294 235, 274 235, 256 225 C 238 235, 218 235, 202 225 C 186 235, 166 230, 166 210 Z" fill="url(#neonCyan)" filter="url(#glow)"/>
  
  <!-- Jelly Core -->
  <circle cx="256" cy="190" r="26" fill="#ffffff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="256" cy="190" r="14" fill="#00bbf9"/>

  <!-- Tentacles converging towards target point -->
  <path d="M 190 230 Q 180 290, 256 360" fill="none" stroke="#00f5d4" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 220 230 Q 200 300, 256 360" fill="none" stroke="#9d4edd" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 256 230 L 256 360" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 292 230 Q 312 300, 256 360" fill="none" stroke="#9d4edd" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 322 230 Q 332 290, 256 360" fill="none" stroke="#00f5d4" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- Location Beacon Point -->
  <circle cx="256" cy="360" r="16" fill="#00f5d4" filter="url(#glow)"/>
  <circle cx="256" cy="360" r="8" fill="#ffffff"/>
  <circle cx="256" cy="360" r="28" fill="none" stroke="#00f5d4" stroke-width="2.5" opacity="0.6"/>
</svg>